# Astro Health dashboard — nginx server block.
# Single-page app: unknown paths fall back to index.html so client-side
# routing keeps working. Vite emits fingerprinted files under /assets/,
# which are safe to cache immutably.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
